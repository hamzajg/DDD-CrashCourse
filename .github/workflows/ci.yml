name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: Documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The chapters are the only artifact, so a relative link to a chapter,
      # diagram or ADR that no longer exists is a broken repository. Offline
      # mode keeps external link rot out of the build.
      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --no-progress '*.md' 'docs/**/*.md'
          fail: true
